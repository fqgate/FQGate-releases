name: 一次性恢复 FQGate 2.0 原始签名链

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: 检出完整历史与签名工具
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装固定版本签名依赖
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: 恢复原始发布文档并修正新鲜度引用
        env:
          PYTHONPATH: scripts
          FRESHNESS_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY }}
          FRESHNESS_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          import finalize_v2_release as tools

          EXPECTED_CURRENT = {
              "releases/v2/2.0.0/release.json": "a20297e9823363a3c9237f6c46144e115273f4e7fbb4f58f51623852d3c8f543",
              "releases/v2/1/stable.json": "5314954ba7ee0507ca2279a884425a663b6d72c4e049bc3af02c526082707aa0",
              "releases/v2/freshness.json": "69437df172f25c8caf0c091d9827f22f3c927630bcff42f3ed8c0d171c7740c9",
          }
          ORIGINAL_RELEASE_HASH = "777b6baeb2c30b9b4cdeaa6aa4a505b53718d654c9776ed909db0152a7d07c3f"
          ORIGINAL_STABLE_HASH = EXPECTED_CURRENT["releases/v2/1/stable.json"]

          for path, expected_hash in EXPECTED_CURRENT.items():
              if tools.sha256_bytes(Path(path).read_bytes()) != expected_hash:
                  raise SystemExit(f"线上基线已改变，停止恢复：{path}")

          release_bytes = subprocess.check_output(
              ["git", "show", "df52ede:releases/v2/2.0.0/release.json"]
          )
          stable_bytes = Path("releases/v2/1/stable.json").read_bytes()
          freshness_bytes = Path("releases/v2/freshness.json").read_bytes()
          if tools.sha256_bytes(release_bytes) != ORIGINAL_RELEASE_HASH:
              raise SystemExit("历史 release.json 字节不符合预期")
          if tools.sha256_bytes(stable_bytes) != ORIGINAL_STABLE_HASH:
              raise SystemExit("原始 stable.json 字节不符合预期")

          release = tools.verify_document(
              release_bytes,
              os.environ["RELEASE_PUBLIC_KEY"],
              tools.RELEASE_SIGNING_KEY_ID,
          )
          stable = tools.verify_document(
              stable_bytes,
              os.environ["RELEASE_PUBLIC_KEY"],
              tools.RELEASE_SIGNING_KEY_ID,
          )
          freshness = tools.verify_document(
              freshness_bytes,
              os.environ["FRESHNESS_PUBLIC_KEY"],
              tools.FRESHNESS_SIGNING_KEY_ID,
          )
          tools.validate_stable_payload(stable)
          tools.validate_freshness_payload(freshness)
          if (
              release.get("version") != "2.0.0"
              or release.get("sequence") != 1
              or release.get("expiresAt") != release.get("publishedAt") + 30 * 24 * 60 * 60
          ):
              raise SystemExit("历史 release.json 内容不符合预期")
          if (
              stable["sequence"] != 1
              or stable["version"] != "2.0.0"
              or stable["releasePath"] != "2.0.0/release.json"
              or stable["releaseSha256"] != ORIGINAL_RELEASE_HASH
          ):
              raise SystemExit("原始 stable.json 内容不符合预期")
          if (
              freshness["refreshSequence"] != 3
              or freshness["stablePath"] != "2/stable.json"
          ):
              raise SystemExit("当前 freshness.json 内容不符合预期")

          freshness_key = tools.load_signing_key(
              os.environ["FRESHNESS_PRIVATE_KEY"],
              os.environ["FRESHNESS_PUBLIC_KEY"],
          )
          next_freshness = {
              "schemaVersion": 1,
              "channel": "stable",
              "refreshSequence": freshness["refreshSequence"],
              "issuedAt": freshness["issuedAt"],
              "expiresAt": freshness["expiresAt"],
              "stablePath": "1/stable.json",
              "stableSha256": ORIGINAL_STABLE_HASH,
          }
          tools.validate_freshness_payload(next_freshness)
          next_freshness_bytes = tools.sign_document(
              next_freshness,
              freshness_key,
              tools.FRESHNESS_SIGNING_KEY_ID,
          )
          verified_freshness = tools.verify_document(
              next_freshness_bytes,
              os.environ["FRESHNESS_PUBLIC_KEY"],
              tools.FRESHNESS_SIGNING_KEY_ID,
          )
          if verified_freshness != next_freshness:
              raise SystemExit("新 freshness.json 验签结果不一致")

          outputs = {
              "releases/v2/2.0.0/release.json": release_bytes,
              "releases/v2/1/stable.json": stable_bytes,
              "releases/v2/freshness.json": next_freshness_bytes,
          }
          for path, document in outputs.items():
              target = Path("restored-channel") / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(document)
          print(
              f"restored release={ORIGINAL_RELEASE_HASH} stable={ORIGINAL_STABLE_HASH} "
              f"freshnessSequence={next_freshness['refreshSequence']}"
          )
          PY
      - name: 保存恢复结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-v2-original-chain-restored
          path: restored-channel
          if-no-files-found: error
          retention-days: 1
