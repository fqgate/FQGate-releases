name: 正式发布 FQGate 2.0

on:
  repository_dispatch:
    types: [fqgate-v2-draft-ready]
  workflow_dispatch:
    inputs:
      version:
        description: 用于正式发布或恢复发布的版本号
        required: true
        type: string
  schedule:
    # Freshness 有效 12 小时；每 4 小时刷新，为短时故障保留余量。
    - cron: '17 */4 * * *'

permissions:
  contents: read

concurrency:
  # 正式发布和 freshness 刷新共同修改唯一入口，必须串行。
  group: fqgate-v2-stable-channel
  cancel-in-progress: false

jobs:
  validate:
    name: 校验全部发行资产
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      # GitHub 只有具备发行写权限的身份才能读取尚未公开的 Release 草稿。
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 检出发行仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装固定版本签名依赖
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: 验证发布治理脚本
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: 校验草稿、平台元数据和 SHA-256
        run: python3 scripts/finalize_v2_release.py validate --version "$RELEASE_VERSION" --output candidate.json
      - name: 保存已校验候选清单
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-v2-candidate-${{ env.RELEASE_VERSION }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 双源公开并切换稳定通道
    if: github.event_name != 'schedule'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY }}
      FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY }}
      FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY }}
      FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY }}
    steps:
      - name: 检出主分支
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装固定版本签名依赖
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: 重新校验、镜像、公开并事务切换入口
        run: python3 scripts/finalize_v2_release.py finalize --version "$RELEASE_VERSION" --output published.json
      - name: 保存发布结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-v2-published-${{ env.RELEASE_VERSION }}
          path: published.json
          if-no-files-found: error
          retention-days: 30

  refresh-freshness:
    name: 刷新双源在线证明
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY }}
      FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY }}
      FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY }}
    steps:
      - name: 检出发行仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装固定版本签名依赖
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: 刷新 freshness 并完成双源回读
        run: python3 scripts/finalize_v2_release.py refresh --output freshness-result.json
