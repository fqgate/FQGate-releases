name: 正式发布 FQGate 2.0

on:
  repository_dispatch:
    types: [fqgate-v2-draft-ready]
  workflow_dispatch:
    inputs:
      version:
        description: 新版本或同一签名发布记录的续跑版本，不能用于修复历史污染
        required: true
        type: string
permissions:
  contents: read

concurrency:
  # 正式发布修改唯一稳定入口，必须串行。
  group: fqgate-v2-stable-channel
  cancel-in-progress: false

jobs:
  validate:
    name: 校验全部发行资产
    runs-on: ubuntu-24.04
    permissions:
      # GitHub 只有具备发行写权限的身份才能读取尚未公开的 Release 草稿。
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 检出发行仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装固定版本签名和检查依赖
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1 black==24.8.0 ruff==0.11.0
      - name: 检查 V2 发布脚本格式与静态错误
        run: |
          python3 -m black --check scripts/finalize_v2_release.py scripts/test_finalize_v2_release.py scripts/test_release_boundaries.py scripts/v2_*.py scripts/test_v2_*.py
          python3 -m ruff check --select E9,F scripts/finalize_v2_release.py scripts/test_finalize_v2_release.py scripts/test_release_boundaries.py scripts/v2_*.py scripts/test_v2_*.py
      - name: 验证发布治理脚本
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: 校验草稿、平台元数据和 SHA-256
        run: python3 scripts/finalize_v2_release.py validate --version "$RELEASE_VERSION" --output candidate.json
      - name: 保存已校验候选清单
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-v2-candidate-${{ env.RELEASE_VERSION }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 双源发布元数据（完成后等待实机验收）
    needs: validate
    runs-on: ubuntu-24.04
    environment: fqgate-production
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY }}
      FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY }}
      FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY }}
      FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY }}
    steps:
      - name: 检出主分支
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装固定版本签名依赖
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: 只读审计双源完整发行历史
        run: python3 scripts/finalize_v2_release.py audit --version "$RELEASE_VERSION" --output audit.json
      - name: 重新校验并按签名记录向前补齐入口
        run: python3 scripts/finalize_v2_release.py finalize --version "$RELEASE_VERSION" --output published.json
      - name: 保存审计和发布阶段结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-v2-published-${{ env.RELEASE_VERSION }}
          path: |
            audit.json
            published.json
          if-no-files-found: warn
          retention-days: 30
      - name: 提示独立实机验收门禁
        run: |
          python3 -c 'import json; result=json.load(open("published.json", encoding="utf-8")); print("当前阶段：" + result["status"]); print("必须按发布维护文档完成三平台旧状态及新状态启动检查，并显式执行 accept；仅 metadata 阶段不代表发行验收完成。")'
