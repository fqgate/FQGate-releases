name: 一次性迁移 2.0.1 原签名密钥
run-name: 一次性密钥迁移 0deee73e-91f8-4315-8649-246dd469934a

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: fqgate-v2-stable-channel
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'fqgate/FQGate-releases' && github.ref == 'refs/heads/main' && github.actor == 'zhuyifang'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 只向本次固定接收公钥加密
        shell: bash
        env:
          FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY }}
          FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ulimit -c 0
          node <<'NODE'
          // 此任务只加密原私钥；不检出仓库，不签发行文档，不调用发布接口。
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          function canonical(value) {
            if (value === null || typeof value !== 'object') return JSON.stringify(value);
            if (Array.isArray(value)) return '[' + value.map(canonical).join(',') + ']';
            return '{' + Object.keys(value).sort().map(k => JSON.stringify(k) + ':' + canonical(value[k])).join(',') + '}';
          }

          function seal(recipient, context, values) {
            const key = crypto.createPublicKey(recipient.publicKeyPem);
            if (key.asymmetricKeyType !== 'rsa' || key.asymmetricKeyDetails.modulusLength !== 4096) throw new Error('invalid recipient');
            if (crypto.createHash('sha256').update(recipient.publicKeyPem).digest('hex') !== recipient.recipientSha256) throw new Error('invalid fingerprint');
            const ciphertexts = {};
            for (const role of ['release', 'freshness']) {
              const value = Buffer.from(values[role] || '', 'utf8');
              if (value.length < 1 || value.length > 446) throw new Error('invalid key size');
              const oaepLabel = Buffer.from(canonical({context, role, protocol: 'fqgate-key-migration-v1'}), 'utf8');
              ciphertexts[role] = crypto.publicEncrypt({key, padding: crypto.constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256', oaepLabel}, value).toString('base64');
              value.fill(0);
            }
            return {context, ciphertexts};
          }

          try {
            const recipient = {"migrationId":"0deee73e-91f8-4315-8649-246dd469934a","publicKeyPem":"-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAj+rlkLoidsmUuuNacnGm\nrIVM0B/AmzRhffYkEfUB5PW0Bm0OXkcIYjNjac+kX2zpw2NcptT7TfBylJT+Jrk/\nHtQbZu0PlSfOXITnOjv6GRNKLsvVQbaTb5A6ogpE5REZvvI62OFobkwarTIbPLSk\nMfdWCjtSBGOKcguPTDgtZSbO85sc1iiM8nCNv8nInDEitOTbcjD54J3M1JdqAmyU\n0kO8vwMc3o+0gX8v7Tz9gs9Uqn78DFf6ndTUS3ywxnxJv8QU0mTi+Nct8fnWKAb0\nkKQaWMaiyYumRNLsaU6iuggslurIm3wFQEHisw3rB0Zp89UWE/moQZTvGix2IalD\naTaGooIjy4+K8Ju2RfRhRwLmxgcFNoC5BH/SNZ2iI2QjbUFfyZYdPY//wXwWo5tH\nEy+nNyYwBFteXh4kFuIzG0zN/QZtcu3EcFLGa6G6N0cp8882Gz00JDw+imMbO10Q\nFJ3DQ74a2ECFFKSkTaBBGDefiTC/Hb3dVTXkFivzcB8XuCD5sIeZlzegGmfGnkpf\nijMJOvHuf7fgm4/A6iC6/SCi4YhiNr7gO6tTquuNltSzLDtiX1eryfEByWL87t4G\nouhNSszWN+siYT0A2wR5Z9DYcl+Jhb0xFsyMU3C53spYtKuSAkqXcugAzkAnOpnE\nIuRvPodW82JGLAMi7JMDcLECAwEAAQ==\n-----END PUBLIC KEY-----\n","recipientSha256":"9a88e5488a11cfa0bd5d2f835d880f9e90b71744c21f6132488d74ab0fc5c711","repository":"fqgate/FQGate-releases","version":"2.0.1"};
            if (process.env.GITHUB_REPOSITORY !== recipient.repository || process.env.GITHUB_REF !== 'refs/heads/main' || process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('invalid run');
            const context = {repository: recipient.repository, version: recipient.version, migrationId: recipient.migrationId, recipientSha256: recipient.recipientSha256, sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT};
            const encrypted = seal(recipient, context, {release: process.env.FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY, freshness: process.env.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY});
            const directory = process.env.RUNNER_TEMP + '/fqgate-key-migration';
            fs.mkdirSync(directory, {recursive: true, mode: 0o700});
            fs.writeFileSync(directory + '/sealed-keys.json', JSON.stringify(encrypted) + '\n', {mode: 0o600, flag: 'wx'});
            console.log('Encrypted envelope created for recipient ' + recipient.recipientSha256);
          } catch (_) {
            console.error('Key migration encryption failed; secret data is not logged.');
            process.exitCode = 1;
          }
          NODE
      - name: 仅保存加密信封
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-key-migration-0deee73e-91f8-4315-8649-246dd469934a
          path: ${{ runner.temp }}/fqgate-key-migration/sealed-keys.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
