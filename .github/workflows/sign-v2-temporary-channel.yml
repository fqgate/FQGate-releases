name: 临时签名 FQGate 2.0 启动元数据

on:
  workflow_dispatch:
    inputs:
      release_payload:
        description: 已按私有正式候选核对的 2.0.0 元数据正文
        required: true
        type: string
      release_payload_sha256:
        description: 元数据正文 UTF-8 字节的 SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: 检出公共签名工具
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装固定版本签名依赖
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: 校验正文并签名三份元数据
        env:
          PYTHONPATH: scripts
          RELEASE_PAYLOAD: ${{ inputs.release_payload }}
          RELEASE_PAYLOAD_SHA256: ${{ inputs.release_payload_sha256 }}
          FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY }}
          FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY }}
          FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY }}
          FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          import finalize_v2_release as release_tools

          raw_payload = os.environ["RELEASE_PAYLOAD"].encode("utf-8")
          if hashlib.sha256(raw_payload).hexdigest() != os.environ["RELEASE_PAYLOAD_SHA256"]:
              raise SystemExit("本地正文与签名任务的 SHA-256 不一致")
          payload = json.loads(raw_payload)
          release_tools.validate_release_payload(payload)
          if payload["version"] != "2.0.0" or payload["sequence"] != 1:
              raise SystemExit("临时任务只接受首次初始化的 2.0.0 元数据")
          now = int(time.time())
          if not 0 <= now - payload["publishedAt"] < 3600:
              raise SystemExit("本地正文创建时间已失效，请重新生成")

          release_public = os.environ["FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY"]
          freshness_public = os.environ["FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY"]
          if release_public == freshness_public:
              raise SystemExit("两类签名公钥必须不同")
          release_key = release_tools.load_signing_key(
              os.environ["FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY"], release_public
          )
          freshness_key = release_tools.load_signing_key(
              os.environ["FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY"], freshness_public
          )

          release_bytes = release_tools.sign_document(
              payload, release_key, release_tools.RELEASE_SIGNING_KEY_ID
          )
          stable_payload = {
              "schemaVersion": 1,
              "channel": "stable",
              "sequence": 1,
              "version": "2.0.0",
              "releasePath": "2.0.0/release.json",
              "releaseSha256": release_tools.sha256_bytes(release_bytes),
          }
          release_tools.validate_stable_payload(stable_payload)
          stable_bytes = release_tools.sign_document(
              stable_payload, release_key, release_tools.RELEASE_SIGNING_KEY_ID
          )
          freshness_payload = {
              "schemaVersion": 1,
              "channel": "stable",
              "refreshSequence": 1,
              "issuedAt": now,
              "expiresAt": now + release_tools.FRESHNESS_LIFETIME_SECONDS,
              "stablePath": "1/stable.json",
              "stableSha256": release_tools.sha256_bytes(stable_bytes),
          }
          release_tools.validate_freshness_payload(freshness_payload)
          freshness_bytes = release_tools.sign_document(
              freshness_payload, freshness_key, release_tools.FRESHNESS_SIGNING_KEY_ID
          )
          documents = [
              ("releases/v2/2.0.0/release.json", release_bytes, release_public, release_tools.RELEASE_SIGNING_KEY_ID),
              ("releases/v2/1/stable.json", stable_bytes, release_public, release_tools.RELEASE_SIGNING_KEY_ID),
              ("releases/v2/freshness.json", freshness_bytes, freshness_public, release_tools.FRESHNESS_SIGNING_KEY_ID),
          ]
          for relative_path, content, public_key, key_id in documents:
              release_tools.verify_document(content, public_key, key_id)
              path = Path("temporary-channel") / relative_path
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          print(json.dumps({
              "version": payload["version"],
              "freshnessExpiresAt": freshness_payload["expiresAt"],
              "releaseExpiresAt": payload["expiresAt"],
              "releasePublished": False,
          }))
          PY
      - name: 保存已签名元数据供本地回读
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-v2-temporary-channel
          path: temporary-channel
          if-no-files-found: error
          retention-days: 1
