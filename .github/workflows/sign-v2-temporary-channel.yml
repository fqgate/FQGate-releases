name: 一次性重签 FQGate 2.0 双源元数据

on:
  workflow_dispatch:
    inputs:
      release_payload:
        description: 已核对的 2.0.0 release 正文
        required: true
        type: string
      release_payload_sha256:
        description: release 正文 SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: 检出签名工具
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装固定版本签名依赖
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: 校验并签署新合同
        env:
          PYTHONPATH: scripts
          RELEASE_PAYLOAD: ${{ inputs.release_payload }}
          RELEASE_PAYLOAD_SHA256: ${{ inputs.release_payload_sha256 }}
          RELEASE_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_RELEASE_SIGNING_V1_PRIVATE_KEY }}
          FRESHNESS_PRIVATE_KEY: ${{ secrets.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PRIVATE_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_RELEASE_SIGNING_V1_PUBLIC_KEY }}
          FRESHNESS_PUBLIC_KEY: ${{ vars.FQGATE_UPDATE_FRESHNESS_SIGNING_V1_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          import finalize_v2_release as tools

          raw = os.environ["RELEASE_PAYLOAD"].encode("utf-8")
          if hashlib.sha256(raw).hexdigest() != os.environ["RELEASE_PAYLOAD_SHA256"]:
              raise SystemExit("release 正文摘要不一致")
          release = json.loads(raw)
          tools.validate_release_payload(release)
          if release["version"] != "2.0.0" or release["sequence"] != 2:
              raise SystemExit("一次性任务只接受 2.0.0 / sequence 2")

          release_public = os.environ["RELEASE_PUBLIC_KEY"]
          freshness_public = os.environ["FRESHNESS_PUBLIC_KEY"]
          if release_public == freshness_public:
              raise SystemExit("签名公钥不得复用")
          release_key = tools.load_signing_key(os.environ["RELEASE_PRIVATE_KEY"], release_public)
          freshness_key = tools.load_signing_key(os.environ["FRESHNESS_PRIVATE_KEY"], freshness_public)

          release_bytes = tools.sign_document(release, release_key, tools.RELEASE_SIGNING_KEY_ID)
          stable = {
              "schemaVersion": 1,
              "channel": "stable",
              "sequence": 2,
              "version": "2.0.0",
              "releasePath": "2.0.0/release.json",
              "releaseSha256": tools.sha256_bytes(release_bytes),
          }
          tools.validate_stable_payload(stable)
          stable_bytes = tools.sign_document(stable, release_key, tools.RELEASE_SIGNING_KEY_ID)
          now = int(time.time())
          freshness = {
              "schemaVersion": 1,
              "channel": "stable",
              "refreshSequence": 2,
              "issuedAt": now,
              "expiresAt": now + tools.FRESHNESS_LIFETIME_SECONDS,
              "stablePath": "2/stable.json",
              "stableSha256": tools.sha256_bytes(stable_bytes),
          }
          tools.validate_freshness_payload(freshness)
          freshness_bytes = tools.sign_document(freshness, freshness_key, tools.FRESHNESS_SIGNING_KEY_ID)

          documents = (
              ("releases/v2/2.0.0/release.json", release_bytes, release_public, tools.RELEASE_SIGNING_KEY_ID),
              ("releases/v2/2/stable.json", stable_bytes, release_public, tools.RELEASE_SIGNING_KEY_ID),
              ("releases/v2/freshness.json", freshness_bytes, freshness_public, tools.FRESHNESS_SIGNING_KEY_ID),
          )
          for relative, content, public_key, key_id in documents:
              tools.verify_document(content, public_key, key_id)
              path = Path("temporary-channel") / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          print(json.dumps({"freshnessExpiresAt": freshness["expiresAt"]}))
          PY
      - name: 保存签名结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-v2-temporary-channel-v2
          path: temporary-channel
          if-no-files-found: error
          retention-days: 1
