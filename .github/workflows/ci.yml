name: 发行仓库持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fqgate-releases-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 公开脚本测试
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 运行发布与行情基准测试
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: 检查行情基准命令行入口
        run: python3 scripts/benchmark_market_snapshots.py --list-providers
      - name: 检查行情快照场景清单
        run: python3 scripts/benchmark_market_snapshots.py --list-scenarios
      - name: 检查行情报告生成入口
        run: python3 scripts/generate_market_benchmark_report.py --help
