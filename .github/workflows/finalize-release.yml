name: 正式发布 FQGate

on:
  repository_dispatch:
    types: [fqgate-draft-ready]
  workflow_dispatch:
    inputs:
      version:
        description: 用于恢复发布的版本号
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fqgate-finalize-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: 校验全部发行资产
    runs-on: ubuntu-24.04
    # GitHub 只有具备发行写权限的身份才能读取尚未公开的 Release 草稿。
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 检出发行仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 校验草稿、平台元数据和 SHA-256
        run: python3 scripts/finalize_release.py validate --version "$RELEASE_VERSION" --output candidate.json
      - name: 保存已校验候选清单
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-candidate-${{ env.RELEASE_VERSION }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 公开 Release 并切换稳定通道
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 检出主分支
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 重新校验等待期间的发行资产
        run: python3 scripts/finalize_release.py validate --version "$RELEASE_VERSION" --output candidate.json
      - name: 提交未发布版本清单
        run: |
          git pull --ff-only origin main
          python3 scripts/finalize_release.py prepare --candidate candidate.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/$RELEASE_VERSION.json"
          if ! git diff --cached --quiet; then
            git commit -m "准备 FQGate $RELEASE_VERSION 公开发布"
            git push origin HEAD:main
          fi
      - name: 正式公开 GitHub Release
        id: release
        run: python3 scripts/finalize_release.py publish --candidate candidate.json --output published.json
      - name: 最后切换稳定通道
        run: |
          git pull --ff-only origin main
          python3 scripts/finalize_release.py promote --manifest published.json
          git add "releases/$RELEASE_VERSION.json" releases/stable.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "发布 FQGate $RELEASE_VERSION 稳定版"
            git push origin HEAD:main
          fi
